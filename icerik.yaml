# ─── Sürü İHA sayfası (/suru-iha/, /en/swarm/) ───────────────────────────────────────────────
# Kaynak: takımın 2026 Ön Tasarım Raporu ve uçuş kodu. Benzetimlerin düğme ve durum metinleri src/lib/i18n-suru.ts içinde.
# "teknik" maddeleri sayfada "Teknik ayrıntı" kutusunda kapalı durur.
# Uzun metinler bilerek ayrı satırda: { tr: ..., en: ... } içinde tırnaksız yazılan metin ilk virgülde kesilir.
suru_sayfa:
  baslik:
    tr: Sürü İHA
    en: Swarm UAV
  ozet:
    tr: Tek bir İHA birçok işi yapabiliyor. Peki neden birkaç İHA'yı birlikte uçurmaya uğraşıyoruz? Bu sayfada bunu ve Matris'in sürüsünün yarışmada nasıl uçtuğunu, her bölümde oynayabileceğin bir benzetimle anlatıyoruz.
    en: A single UAV can do a lot. So why go to the trouble of flying several together? This page explains that, and how the Matris swarm flies at the competition, with a simulation you can play with in every section.
  neden:
    - baslik:
        tr: Neden İHA?
        en: Why UAVs?
      metin:
        tr: İHA, içinde pilot olmadan uçan hava aracı. İnsan göndermenin tehlikeli ya da zor olduğu yerlere gidebiliyor, örneğin depremden sonra bir enkaz alanına, orman yangınının üstüne ya da yüksek bir köprünün altına. Tarla, boru hattı, kıyı şeridi gibi her gün aynı şekilde taranması gereken geniş alanlarda da insanın yerine uçabiliyor.
        en: A UAV is an aircraft with no pilot on board. It can go where sending a person is dangerous or hard, such as a site after an earthquake, above a forest fire or under a tall bridge. It can also take over wide areas that need surveying the same way every day, like fields, pipelines and coastlines.
    - baslik:
        tr: Neden tek değil de sürü?
        en: Why a swarm rather than one?
      metin:
        tr: Tek İHA'nın pili kısa sürer, kamerası tek yere bakar. Aynı alanı birkaç İHA paylaşınca iş daha çabuk biter. Biri bozulursa ötekiler onun işini alır. Her araca ayrı bir pilot da gerekmez, sürüye verilen tek komutu araçlar kendi aralarında bölüşür.
        en: One UAV's battery runs out quickly and its camera looks at one spot. When several UAVs share an area the job finishes sooner. If one breaks down the others take over its work. Nor does each vehicle need its own pilot, because the vehicles split a single command among themselves.
    - baslik:
        tr: Sürüyü zor yapan ne?
        en: What makes a swarm hard?
      metin:
        tr: Birkaç metre arayla uçan araçlar birbirine çarpmamalı. Hepsi her an birbirinden haber almalı ve nerede olduğunu bilmeli. Bir de kararı kimin vereceği belli olmalı, yoksa her araç başka yöne gider.
        en: Vehicles flying a few metres apart must not collide. They all need to hear from each other all the time and know where they are. And it has to be clear who decides, or every vehicle heads its own way.
  cevaplar:
    - soru:
        tr: Çarpışmadan kaçınma
        en: Avoiding collisions
      cevap:
        tr: Her İHA, çevresindekilerin hızına bakıp birkaç saniye içinde çarpışma olup olmayacağını hesaplıyor (ORCA algoritması). Risk varsa kendi hızını biraz değiştiriyor, yoksa hiç karışmıyor ve dizilimdeki yerinde uçmaya devam ediyor.
        en: Each UAV looks at the velocities around it and works out whether a collision is coming within a few seconds (the ORCA algorithm). If so it adjusts its own velocity slightly, otherwise it stays out of the way and keeps flying in its slot.
    - soru:
        tr: Haberleşme
        en: Communication
      cevap:
        tr: İHA'lar Wi-Fi 6 ağı üzerinden UDP paketleriyle konuşuyor. Lider saniyede 20 paket gönderiyor, takipçiler saniyede 5. Ağ mesh yapıda, bir İHA menzil dışına çıkarsa verisi yakınındaki başka bir İHA üzerinden aktarılıyor.
        en: The UAVs talk over a Wi-Fi 6 network with UDP packets. The leader sends 20 packets a second and the followers 5. The network is a mesh, so if a UAV drifts out of range its data is relayed through a UAV near it.
    - soru:
        tr: Konum
        en: Position
      cevap:
        tr: Her İHA'nın nerede olduğunu GPS söylüyor. Bunun yanında UWB modülü, İHA'lar arasındaki mesafeyi sinyalin gidip gelme süresinden ölçüyor. GPS zayıfladığında dizilim bu ölçümle korunuyor.
        en: GPS tells each UAV where it is. Alongside it, a UWB module measures the distance between UAVs from how long a signal takes to travel. When GPS gets weak, that measurement keeps the formation together.
    - soru:
        tr: Karar
        en: Decisions
      cevap:
        tr: Sürüde bir lider ve takipçiler var. Rotayı ve görevi lider yönetiyor, takipçiler liderin konumuna bakıp kendi yerini kendisi hesaplıyor. Hepsi aynı yazılımı çalıştırdığı için lider düşerse başka bir İHA onun yerini alabiliyor.
        en: The swarm has a leader and followers. The leader runs the route and the mission, and each follower works out its own position from the leader's. They all run the same software, so if the leader goes down another UAV can take its place.
  tarama:
    baslik:
      tr: Tek İHA ile sürü yarışıyor
      en: One UAV races a swarm
    giris:
      tr: Solda tek İHA, sağda bir sürü aynı alanı tarıyor. İkisi aynı anda başlıyor. Sürüye kaç İHA koyacağını sen seçiyorsun, tarama sürerken sürüden ya da tek İHA'dan birini düşürüp ne olduğuna da bakabilirsin.
      en: On the left a single UAV, on the right a swarm, both surveying the same area. They start at the same moment. You choose how many UAVs the swarm has, and while the survey runs you can take one down, from the swarm or the single one, to see what happens.
    teknik:
      - tr: Alan 12 × 8 kareye ayrılıyor ve 8 şerit halinde taranıyor. Şeritler sürüdeki İHA'lara sırayla paylaştırılıyor.
        en: The area is split into 12 × 8 squares and surveyed in 8 strips. The strips are shared out among the swarm's UAVs in order.
      - tr: Bir İHA düşerse yarım kalan şeridi ve henüz başlamadığı şeritler, işi en az kalan İHA'lara veriliyor. Hızlar ve süreler gerçek değil, benzetim için kısaltıldı.
        en: If a UAV goes down, its half-done strip and the strips it had not started go to the UAVs with the least work left. Speeds and times are not real, they are shortened for the simulation.
  yarisma:
    baslik:
      tr: Yarışma ne istiyor?
      en: What does the competition ask for?
    giris:
      tr: TEKNOFEST Sürü İHA Yarışması'nda en az üç İHA'dan oluşan sürü iki görev uçuyor.
      en: At the TEKNOFEST Swarm UAV Competition a swarm of at least three UAVs flies two missions.
    gorevler:
      - baslik:
          tr: "Görev 1: Dinamik sürü kabiliyeti"
          en: "Mission 1: Dynamic swarm capability"
        maddeler:
          - tr: İHA'lar belirlenen dizilimde aynı anda kalkıyor. Kalkıştan inişe kadar kimse kumandaya dokunmuyor.
            en: The UAVs take off together in a set formation. Nobody touches a remote from take-off to landing.
          - tr: Yerde QR kodları var. Sürüdeki en az bir İHA bunları kamerasıyla okuyor.
            en: There are QR codes on the ground. At least one UAV in the swarm reads them with its camera.
          - tr: Kodda yeni bir dizilim (çizgi, V ya da ok başı), yeni bir irtifa ya da öne, arkaya, yana yatma komutu olabiliyor. Sürü bunları yaparken merkezini ve aralıklarını bozmamalı.
            en: A code can hold a new formation (line, V or arrowhead), a new altitude or a command to tilt forward, back or sideways. The swarm must keep its centre and spacing while doing it.
          - tr: Kod bir İHA'yı sürüden ayırabiliyor. O İHA kırmızı ya da mavi daireye iniyor, bekliyor ve sürüye geri dönüyor. Yedek İHA varsa boşalan yere o da girebiliyor.
            en: A code can send one UAV out of the swarm. It lands on a red or blue circle, waits and flies back. If there is a reserve UAV, it can fill the empty place instead.
          - tr: Her kod sıradaki QR'ın numarasını veriyor. Son kod okununca sürü dizilimini bozmadan başladığı yere dönüp iniyor.
            en: Each code gives the number of the next QR. After the last one the swarm flies back to where it started without breaking formation and lands.
      - baslik:
          tr: "Görev 2: Yarı otonom sürü kontrolü"
          en: "Mission 2: Semi-autonomous swarm control"
        maddeler:
          - tr: Pilot bütün sürüyü tek bir kumandayla, tek bir İHA uçurur gibi uçuruyor.
            en: The pilot flies the whole swarm with one remote, as if it were a single UAV.
          - tr: Hareket modunda sürü ileri, geri ve yanlara gidiyor, yükselip alçalıyor. Pilot sürüyü döndürdüğünde merkez yerinde kalıyor ve bütün İHA'lar birlikte dönüyor.
            en: In move mode the swarm goes forward, back and sideways, and climbs or descends. When the pilot turns the swarm, the centre stays put and all the UAVs turn together.
          - tr: Manevra modunda bütün dizilim öne, arkaya ya da yana yatıyor.
            en: In manoeuvre mode the whole formation tilts forward, back or sideways.
          - tr: Sürü hiçbir harekette dağılmamalı. Bir İHA geride kalır ya da ötekilerden farklı hareket ederse görev başarısız sayılıyor.
            en: The swarm must not come apart in any move. If one UAV lags or moves differently from the rest, the mission counts as failed.
  roller:
    baslik:
      tr: Lider, takipçi ve yedek
      en: Leader, follower and reserve
    giris:
      tr: Matris'in İHA'larının hepsinde aynı yazılım çalışıyor. Hangisinin lider olacağı uçarken belli oluyor, başta en küçük numaralı İHA lider. Rolünü görmek için bir İHA'ya tıkla.
      en: All Matris UAVs run the same software. Which one leads is settled in flight, and at the start it is the lowest-numbered UAV. Click a UAV to see its role.
    lider:
      ad:
        tr: Lider
        en: Leader
      metin:
        tr: Rotayı ve görevin hangi aşamada olduğunu bilen İHA. QR kodunu okuyor, ne yapılacağına karar veriyor ve kararı bütün sürüye duyuruyor.
        en: The UAV that knows the route and where the mission stands. It reads the QR code, decides what to do and tells the whole swarm.
      isler:
        - tr: Rotayı ve görevin sırasını yürütüyor
          en: Runs the route and the order of the mission
        - tr: QR kodunu okuyup içindeki komutu çözüyor
          en: Reads the QR code and decodes the command in it
        - tr: Saniyede 20 kez, yaklaşık 500 baytlık bir durum paketi gönderiyor
          en: Sends a state packet of about 500 bytes 20 times a second
    takipci:
      ad:
        tr: Takipçi
        en: Follower
      metin:
        tr: Liderden gelen pakete bakıp dizilimde nerede durması gerektiğini kendisi hesaplıyor ve bunu kendi otopilotuna gönderiyor. Bunun için yerde ya da havada merkezi bir bilgisayar gerekmiyor.
        en: Looks at the leader's packet, works out where it should be in the formation and sends that to its own autopilot. No central computer on the ground or in the air is needed for this.
      isler:
        - tr: Dizilimdeki yerini kendisi hesaplıyor
          en: Works out its own place in the formation
        - tr: Bir İHA'ya fazla yaklaşırsa ORCA ile rotasını düzeltiyor
          en: Corrects its path with ORCA if it gets too close to another UAV
        - tr: Saniyede 5 kez, yaklaşık 200 baytlık bir paketle konumunu ve durumunu bildiriyor
          en: Reports its position and state in a packet of about 200 bytes 5 times a second
        - tr: Sürüden ayrılması istenirse daireyi bulma, inme ve geri dönme işini kendi başına yapıyor
          en: When told to leave the swarm, finds the circle, lands and comes back on its own
    yedek:
      ad:
        tr: Yedek
        en: Reserve
      metin:
        tr: Başlangıç noktasında yerde bekleyen İHA. Sürüde bir yer boşalınca lider SUBSTITUTE komutunu gönderiyor, yedek de motorlarını çalıştırıp o yere uçuyor.
        en: The UAV waiting on the ground at the starting point. When a place in the swarm empties, the leader sends SUBSTITUTE and the reserve starts its motors and flies there.
      isler:
        - tr: Motorları kapalı bekliyor
          en: Waits with its motors off
        - tr: Çağrılınca kalkıp boş yere uçuyor
          en: Takes off and flies to the empty place when called
        - tr: Sürüye girdikten sonra takipçi gibi çalışıyor
          en: Works as a follower once it has joined
    teknik:
      - tr: Bütün sürünün ağ trafiği saniyede yaklaşık 15 KB. Yer istasyonu yalnızca görevi başlatmak için kullanılıyor, uçuş sırasındaki kararların hepsini sürü kendisi veriyor.
        en: The whole swarm's network traffic is about 15 KB a second. The ground station is only used to start the mission, and the swarm makes every decision in flight by itself.
      - tr: Görüntü işleme İHA'nın üstünde yapıldığı için yere video gönderilmiyor. Her İHA'da bir Pixhawk otopilot ile bir Raspberry Pi 4 görev bilgisayarı var, ikisi MAVLink ile konuşuyor.
        en: Image processing runs on the UAV, so no video is sent to the ground. Each UAV has a Pixhawk autopilot and a Raspberry Pi 4 mission computer that talk over MAVLink.
  gorev:
    baslik:
      tr: "Görev 1, adım adım"
      en: "Mission 1, step by step"
    giris:
      tr: Altı QR'lı bir alanda sürü kalkıştan inişe kadar kendi başına uçuyor. Başlat'a basıp izleyebilir ya da Sonraki adım ile her aşamada durabilirsin.
      en: On an area with six QR codes the swarm flies on its own from take-off to landing. Press Start and watch, or use Next step to stop at each stage.
    teknik:
      - tr: "Liderin geçtiği durumlar sırasıyla IDLE, GO_TO_QR, FACE_NORTH, CENTER_QR ve EXECUTING. Sürüden ayrılan takipçininkiler GO_TO_MARKED, SEARCH_CIRCLE, CENTER_CIRCLE, REJOIN_GROUND ve REJOIN_FLYING."
        en: "The leader goes through IDLE, GO_TO_QR, FACE_NORTH, CENTER_QR and EXECUTING in that order. A follower leaving the swarm goes through GO_TO_MARKED, SEARCH_CIRCLE, CENTER_CIRCLE, REJOIN_GROUND and REJOIN_FLYING."
      - tr: QR okurken kameradan gelen görüntü 640×480'e küçültülüyor. Gri tonlama, eşikleme, Gaussian bulanıklaştırma ve Otsu eşikleme sırayla deneniyor, kodu PyZbar çözüyor. İçindeki metin JSON olarak okunuyor.
        en: To read a QR code the camera image is scaled to 640×480. Greyscale, thresholding, Gaussian blur and Otsu thresholding are tried in turn and PyZbar decodes the code. The text inside is read as JSON.
      - tr: Ayrılan İHA iniş dairesini renge göre (HSV maskesi) ve şekline göre (kontur analizi) buluyor.
        en: The UAV that leaves finds its landing circle by colour (an HSV mask) and by shape (contour analysis).
      - tr: Kod okunamazsa sürü olduğu yerde bekliyor ve kodu okuyana kadar yavaş yavaş alçalıyor.
        en: If the code cannot be read, the swarm holds where it is and slowly descends until it can read it.
  konsol:
    baslik:
      tr: Komut konsolu
      en: Command console
    giris:
      tr: Lider sürüye kısa komutlar gönderiyor. Burada o komutları sen gönderiyorsun, sürünün ne yaptığını ve giden paketi görüyorsun. Her komut her an işe yaramıyor. Sürü yerdeyken irtifa değiştirilemiyor, STAY_GROUNDED da ancak ayrılan İHA yerde beklerken kullanılabiliyor.
      en: The leader sends the swarm short commands. Here you send them yourself and see what the swarm does and the packet that goes out. Not every command works at every moment. Altitude cannot change while the swarm is on the ground, and STAY_GROUNDED only works while a separated UAV is waiting on the ground.
    teknik:
      - tr: Paketler takımın uçuş kodundakilerin kısaltılmış hali. Gerçek paketlerde ayrıca roller, yuva ofsetleri ve başlangıç noktası da gidiyor.
        en: The packets are shortened from the team's flight code. The real ones also carry the roles, the slot offsets and the starting point.
      - tr: PITCH_ROLL komutunda her takipçi, dizilimin ortasına olan uzaklığına göre biraz yükseliyor ya da alçalıyor. Bu yüzden bütün dizilim tek bir düz levha gibi eğiliyor.
        en: On a PITCH_ROLL command each follower climbs or drops a little depending on how far it is from the middle of the formation. That is why the whole formation tilts like one flat sheet.
  lider:
    baslik:
      tr: Lider düşerse
      en: If the leader goes down
    giris:
      tr: Lider iki şekilde sürüden çıkabilir. Ya beklenmedik bir arıza olur ya da görev liderin ayrılmasını ister. İki durumda sürünün yaptığı farklı, ikisini de dene.
      en: The leader can leave the swarm in two ways. Either something fails without warning or the mission asks the leader to leave. The swarm reacts differently in each case, so try both.
    teknik:
      - tr: Her takipçi liderden en son ne zaman paket geldiğini sayıyor. İHA 1 6 saniye, İHA 2 7 saniye bekliyor. Önce süresi dolan İHA kendini lider ilan ediyor, onun paketini alan öteki İHA sayacını sıfırlıyor. Böylece aynı anda iki lider çıkmıyor.
        en: Each follower counts how long since the leader's last packet. UAV 1 waits 6 seconds and UAV 2 waits 7. The one whose time runs out first declares itself leader, and the other resets its timer when it hears the new leader's packet. That way two leaders never appear at once.
      - tr: Arıza durumunda yeni lider sürüyü eve döndürüyor (RTL) ve görev orada bitiyor. Görevin sürmesi için planlı devir (HANDOFF) gerekiyor. Bu durumda eski lider o anki görev bilgisini yeni lidere gönderiyor, yeni lider de görevi kendi kamerasıyla sürdürüyor.
        en: After a failure the new leader takes the swarm home (RTL) and the mission ends there. For the mission to go on, a planned handover (HANDOFF) is needed. The old leader then sends the current mission state to the new leader, which carries on with its own camera.
  geometri:
    baslik:
      tr: Dizilimin geometrisi
      en: The geometry of a formation
    giris:
      tr: Her takipçi lidere göre yerini iki sayıyla biliyor, ne kadar önde ve ne kadar yanda olduğuyla. Sürü dönünce bu iki sayı da aynı açıyla dönüyor. Yönü, aralığı ve eğimi değiştirip tablodaki sayıların nasıl değiştiğine bakabilirsin.
      en: Each follower knows its place relative to the leader as two numbers, how far ahead and how far to the side. When the swarm turns, both numbers turn by the same angle. Change the heading, spacing and tilt and watch the numbers in the table.
    teknik:
      - tr: "x = cos θ · ileri − sin θ · yan, y = sin θ · ileri + cos θ · yan. θ sürünün yönü, 0° doğu ve 90° kuzey."
        en: "x = cos θ · forward − sin θ · side, y = sin θ · forward + cos θ · side. θ is the swarm's heading, with 0° east and 90° north."
      - tr: "Ofsetler çizgide (0, ±k·a), V'de (k·a, ±k·a), ok başında (−k·a, ±k·a). k yuvanın kaçıncı sırada olduğu, a da aralık. Tek numaralı yuvalar bir yanda, çift numaralılar öbür yanda duruyor."
        en: "The offsets are (0, ±k·a) for a line, (k·a, ±k·a) for a V and (−k·a, ±k·a) for an arrowhead. k is the slot's rank and a the spacing. Odd slots sit on one side and even slots on the other."
      - tr: "Eğilirken her İHA'nın yükseklik farkı, dizilimin ortasına uzaklığı çarpı tan(açı) · 2."
        en: "When tilting, each UAV's height difference is its distance from the middle of the formation times tan(angle) · 2."
      - tr: Takımın kodunda varsayılan aralık da seyir irtifası da 8 m. Her İHA görev boyunca hep aynı yuvada kalıyor.
        en: In the team's code the default spacing and the cruise altitude are both 8 m. Each UAV stays in the same slot for the whole mission.
  not:
    tr: Benzetimler takımın yaklaşımının basitleştirilmiş hali, uçuş yazılımının kendisi değil. Sayılar ve teknik bilgiler takımın 2026 Ön Tasarım Raporu'ndan ve uçuş kodundan.
    en: The simulations are a simplified version of the team's approach, not the flight software itself. The figures and technical details come from the team's 2026 Preliminary Design Report and flight code.

      gomulu: { tr: Gömülü sistemler, en: Embedded systems }
      haberlesme: { tr: Haberleşme, en: Communication }
  elektronik:
    ad: { tr: Elektronik, en: Electronics }
    ozet: { tr: Araçların üstündeki bütün kartlar ve kablolar., en: Every board and wire on the vehicles. }
    dallar:
      aviyonik: { tr: Aviyonik, en: Avionics }
      guc: { tr: Güç sistemi, en: Power system }
      montaj: { tr: Montaj ve kablolama, en: Assembly and wiring }
  mekanik:
    ad: { tr: Mekanik, en: Mechanics }
    ozet: { tr: Gövde ve sahadaki uçuş denemeleri., en: The airframe and the flight tests in the field. }
    dallar:
      tasarim: { tr: Gövde tasarımı, en: Airframe design }
      uretim: { tr: Üretim, en: Manufacturing }
      test: { tr: Uçuş testleri, en: Flight testing }

ekip_yazisi:
  tr: Takım üç ana ekipten oluşur. Her ekip kendi içinde dallara ayrılır, böylece her üyenin sorumluluğu bellidir.
  en: The team is made up of three main groups. Each group is split into branches, so every member has a clear responsibility.


ekipler:
  algoritma: { tr: Algoritma, en: Algorithms }
  aviyonik: { tr: Aviyonik ve yazılım, en: Avionics and software }
  mekanik: { tr: Mekanik ve test, en: Mechanics and testing }
  elektronik: { tr: Elektronik, en: Electronics }

ekip_yazisi:
  tr: Ekibimiz algoritma, aviyonik/yazılım, mekanik-test ve elektronik alanlarında görev paylaşımı yaparak çalışır. Bu yapı, sürecin düzenli ilerlemesini ve her ekip üyesinin net bir sorumlulukla katkı sunmasını sağlar.
  en: Our team shares the work across algorithms, avionics/software, mechanics-testing and electronics. This structure keeps the process orderly and gives every member a clear responsibility.


suru:
  anlatim:
    tr:
      - Sürü İHA, birlikte uçan ve aynı görevi paylaşan insansız hava araçlarıdır (İHA). Her araç kendi konumunu bilir, ötekilerle haberleşir ve hareketini sürünün geri kalanına göre ayarlar.
      - Sürüde her aracı ayrı bir pilot yönetmez. Sürüye tek bir komut verilir, araçlar işi kendi aralarında paylaşır. Bir araç devre dışı kalsa bile kalanlar görevi sürdürür.
    en:
      - A UAV swarm is a group of unmanned aerial vehicles (UAVs) that fly together and share one mission. Each vehicle knows its own position, talks to the others and adjusts its motion to the rest of the swarm.
      - No pilot flies each vehicle separately. The swarm receives a single command and the vehicles divide the work among themselves. If one vehicle drops out, the rest carry on with the mission.
  # Yarışmanın ne istediği. Kaynak: takımın 2026 Ön Tasarım Raporu, "Proje Gereksinimleri" bölümü. Boşken görünmez.
  yarisma:
    tr: Yarışmada en az üç İHA'dan oluşan bir sürü iki görev uçar. İlk görevde sürü kalkıştan inişe kadar kendi başına uçar, yerdeki QR kodlarını okur ve kodun söylediğini yapar. Dizilim değiştirir, yükselir ya da alçalır, bir üyesini ayırıp geri alır. İkinci görevde bütün sürü tek bir kumandayla, tek bir İHA gibi yönetilir.
    en: In the competition a swarm of at least three UAVs flies two missions. In the first, the swarm flies on its own from take-off to landing, reads QR codes on the ground and does what each code says. It changes formation, climbs or descends, and sends one member away and takes it back. In the second, the whole swarm is flown with a single remote, like one UAV.


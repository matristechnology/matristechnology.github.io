destek:
  metin:
    tr: MATRİS olarak TEKNOFEST Sürü İHA kategorisinde otonom uçuş, sürü koordinasyonu, haberleşme ve saha testleri üzerine çalışmalar yürütüyoruz. Projemizin sürdürülebilir ilerlemesi için malzeme, üretim, test, yazılım ve finansal destek alanlarında iş birlikleri geliştirmeyi hedefliyoruz.
    en: As MATRİS we work on autonomous flight, swarm coordination, communication and field testing in the TEKNOFEST Swarm UAV category. To keep the project moving we aim to build partnerships in materials, manufacturing, testing, software and funding.
  alanlar:
    - { tr: Malzeme desteği, en: Material support }
    - { tr: Üretim ve test desteği, en: Manufacturing and testing support }
    - { tr: Finansal destek, en: Financial support }
  haklar:
    - { tr: Logo görünürlüğü, en: Logo visibility }
    - { tr: Sosyal medya paylaşımları, en: Social media posts }
    - { tr: Etkinlik ve yarışmalarda görünürlük, en: Visibility at events and competitions }
  ihtiyac_yazisi:
    tr: Tasarım, entegrasyon ve saha test süreçlerinde ihtiyaç duyduğumuz temel donanımlar.
    en: The core hardware we need for design, integration and field testing.
  ihtiyaclar:
    - grup: { tr: Uçuş kontrol ve gömülü sistemler, en: Flight control and embedded systems }
      ogeler: [Raspberry Pi 5, Pixhawk Orange Cube, Matek, Power modülü, UBEC, Safe switch, Buzzer modülü]
    - grup: { tr: Haberleşme ve konumlandırma, en: Communication and positioning }
      ogeler: [Here 3 GPS, V5 telemetri, FlySky kumanda, FlySky radyo alıcı, DW1000C UWB, DW1001DEV UWB]
    - grup: { tr: İtki sistemi, en: Propulsion }
      ogeler: [EMAX 820KV motor, Banana ESC 30A, Hobbywing FlyFun 18A, EMAX 20A ESC, T-Air 40A ESC, Skywalker 40A ESC]
    - grup: { tr: Güç ve görüntüleme, en: Power and imaging }
      ogeler: [LiPo batarya, Raspberry Pi Camera V3]
    - grup: { tr: Mekanik bileşenler, en: Mechanical parts }
      ogeler: [S500 frame, 10" pervane CW, 10" pervane CCW, 11" pervane çifti]

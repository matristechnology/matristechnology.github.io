# Dalların ne yaptığı: Takım sayfasındaki organizasyon şemasında ve "Takıma katıl" bölümünde görünür.
# Kaynak: 2026 Ön Tasarım Raporu. Elektronik ve Mekanik dallarının adları henüz onaylanmadı (docs/EKSIKLER.md).
dal_anlatim:
  algoritma:
    tr: Sürünün nasıl uçacağını tasarlıyor. Lider ve takipçi düzeni, dizilimler, çarpışmadan kaçınma (ORCA) ve bunların Gazebo simülasyonunda denenmesi bu dalın işi.
    en: Designs how the swarm flies. The leader and follower scheme, the formations, collision avoidance (ORCA) and testing all of it in the Gazebo simulation are this branch's job.
  goruntu:
    tr: İHA'nın gördüğünü anlamlandırıyor. Kameradan gelen görüntüde QR kodunu okuyor, iniş dairesini rengine ve şekline göre buluyor. OpenCV ve PyZbar kullanıyor.
    en: Makes sense of what the UAV sees. It reads the QR code in the camera image and finds the landing circle by colour and shape. It uses OpenCV and PyZbar.
  gomulu:
    tr: Yazılımı aracın üstündeki donanımda çalıştırıyor. Görev bilgisayarı ile otopilotun birlikte çalışması ve UWB modülünün sisteme bağlanması bu dalın işi.
    en: Runs the software on the hardware aboard the vehicle. Making the mission computer and the autopilot work together and connecting the UWB module to the system are this branch's job.
  haberlesme:
    tr: İHA'ların birbiriyle konuşmasını sağlıyor. Wi-Fi ağı üzerinden giden UDP paketleri ve otopilotla kurulan MAVLink bağlantısı bu dalın işi.
    en: Makes the UAVs talk to each other. The UDP packets going over the Wi-Fi network and the MAVLink link to the autopilot are this branch's job.
  aviyonik:
    tr: Otopilotu ve sensörleri araca yerleştirip ayarlıyor. Pixhawk'ın kurulumu, GPS ve öteki sensörlerin bağlanması bu dalın işi.
    en: Fits and configures the autopilot and the sensors. Setting up the Pixhawk and connecting the GPS and the other sensors are this branch's job.
  guc:
    tr: Aracın enerjisini yönetiyor. Batarya, güç dağıtım kartı, hız kontrolcüleri ve elektroniği besleyen dönüştürücüler bu dalın işi.
    en: Manages the vehicle's energy. The battery, the power distribution board, the speed controllers and the converters feeding the electronics are this branch's job.
  montaj:
    tr: Parçaları araca takıyor ve kablolarını döşüyor. Kabloların gövdeye sabitlenmesi ve soketlerin titreşimle çıkmaması için alınan önlemler bu dalın işi.
    en: Mounts the parts on the vehicle and lays the cables. Fixing the cables to the frame and keeping the connectors from shaking loose are this branch's job.
  tasarim:
    tr: Gövdeyi ve üstüne takılan parçaların tutucularını tasarlıyor. Otopilot ile görev bilgisayarını üst üste taşıyan aparat gibi parçalar burada çiziliyor.
    en: Designs the airframe and the mounts for the parts on it. Pieces such as the carrier that stacks the autopilot and the mission computer are drawn here.
  uretim:
    tr: Tasarlanan parçaları üretiyor. 3B baskı ile çıkan tutucular ve taşıyıcılar bu dalın elinden geçiyor.
    en: Makes the designed parts. The 3D-printed mounts and carriers pass through this branch's hands.
  test:
    tr: Araçları sahada uçuruyor. Uçuş testleri tek İHA ile başlıyor, iki İHA ile sürüyor ve tam sürüyle tamamlanıyor.
    en: Flies the vehicles in the field. Flight tests begin with one UAV, continue with two and finish with the full swarm.

ekip_yazisi:
  tr: Takım üç ana ekipten oluşur. Her ekip kendi içinde dallara ayrılır, böylece her üyenin sorumluluğu bellidir.
  en: The team is made up of three main groups. Each group is split into branches, so every member has a clear responsibility.

